<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arturo — Product Designer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main { text-align: center; padding: 2rem; max-width: 36rem; }
  h1 { font-size: 2.5rem; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 0.75rem; }
  p { font-size: 1.125rem; color: #666; line-height: 1.6; margin-bottom: 2rem; }
  a {
    display: inline-block;
    font-size: 1rem;
    color: #1a1a1a;
    text-decoration: none;
    border: 1px solid #e2e2e2;
    border-radius: 999px;
    padding: 0.625rem 1rem;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  a:hover { border-color: #1a1a1a; background: #fafafa; }
</style>
</head>
<body>
  <main>
    <h1>Arturo Liranzo</h1>
    <p>Product designer at eMoney Advisor.</p>
    <a href="mailto:arturolzo@gmail.com">Get in touch</a>
  </main>
</body>
</html>
